name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 相对链接体检
        run: |
          python3 - <<'PY'
          import os, re, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  for m in re.finditer(r'\[[^\]]+\]\(([^)#]+)\)', open(p, encoding='utf-8', errors='replace').read()):
                      t = m.group(1).strip()
                      if t.startswith(('http://', 'https://', 'mailto:')):
                          continue
                      if not os.path.exists(os.path.normpath(os.path.join(root, t))):
                          bad.append(f"{p}: {t}")
          print("\n".join(bad) if bad else "相对链接全部存在")
          sys.exit(1 if bad else 0)
          PY

  encoding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 所有文本文件必须是合法 UTF-8
        run: |
          python3 - <<'PY'
          import pathlib, sys
          exts = {'.md', '.py', '.json', '.txt', '.yml', '.yaml', '.js', '.mjs', '.cmd', '.sh', '.toml'}
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  p.read_bytes().decode('utf-8')
              except UnicodeDecodeError:
                  bad.append(str(p))
          print('非 UTF-8 文件:', bad if bad else '无')
          sys.exit(1 if bad else 0)
          PY
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 凭据扫描
        run: |
          set -e
          PATTERNS='github_pat_|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{30,}'
          # 注意：docs/PUBLISHING.md 里为了教人自查，本身就写了这些模式，必须排除（否则自匹配）
          if grep -rInE "$PATTERNS" --exclude-dir=.git --exclude-dir=.github --exclude=PUBLISHING.md . ; then
            echo "::error::发现疑似真实凭据，请脱敏后再提交（靶场样例私钥请标注来源）"
            exit 1
          fi
          echo "OK"
